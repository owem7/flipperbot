# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: flipbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SCAN_CACHE_SECS
        value: "60"
